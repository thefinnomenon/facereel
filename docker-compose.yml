services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: facereel
      POSTGRES_PASSWORD: facereel
      POSTGRES_DB: facereel
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  worker:
    build: .
    env_file: [.env]
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: postgresql://facereel:facereel@postgres:5432/facereel
      LOCAL_WORKER_SECRET: local-development-only
    ports: ["8080:8080"]
    depends_on: [postgres]
volumes:
  postgres-data:
